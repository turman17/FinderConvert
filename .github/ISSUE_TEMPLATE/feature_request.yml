name: Feature request
description: Suggest a new format, conversion path, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: A new input/output format, a new conversion path, a setting, a UI improvement…
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What workflow does this unblock for you?
    validations:
      required: false
